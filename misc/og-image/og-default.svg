<?xml version="1.0" encoding="UTF-8"?>
<!--
  Meridian Synergy — OG default image
  Use: og:image fallback for all pages (social sharing)
  Native size: 1200×630 — standard OG image
  Design: navy background, orbital icon left, brand name + taglines right
-->
<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">

  <!-- Background -->
  <rect width="1200" height="630" fill="#1B2A4A"/>

  <!-- Decorative rings (top-right) -->
  <circle cx="1110" cy="90"  r="320" fill="none" stroke="#FFFFFF" stroke-width="1.5" opacity="0.04"/>
  <circle cx="1110" cy="90"  r="230" fill="none" stroke="#00AAEF" stroke-width="1"   opacity="0.05"/>
  <!-- Decorative ring (bottom-left) -->
  <circle cx="55"   cy="575" r="130" fill="none" stroke="#00AAEF" stroke-width="1"   opacity="0.05"/>

  <!-- Accent bars top/bottom -->
  <rect x="0" y="0"   width="1200" height="3" fill="#00AAEF" opacity="0.6"/>
  <rect x="0" y="627" width="1200" height="3" fill="#00AAEF" opacity="0.6"/>

  <!-- Orbital icon: center (185, 315) r=145 -->
  <defs>
    <clipPath id="og-clip">
      <circle cx="185" cy="315" r="145"/>
    </clipPath>
  </defs>
  <g clip-path="url(#og-clip)">
    <ellipse cx="185" cy="315" rx="55" ry="145" fill="none" stroke="#FFFFFF" stroke-width="7" transform="rotate(0,185,315)"/>
    <ellipse cx="185" cy="315" rx="55" ry="145" fill="none" stroke="#FFFFFF" stroke-width="7" transform="rotate(60,185,315)"/>
    <ellipse cx="185" cy="315" rx="55" ry="145" fill="none" stroke="#FFFFFF" stroke-width="7" transform="rotate(120,185,315)"/>
    <ellipse cx="185" cy="315" rx="145" ry="28"  fill="none" stroke="#FFFFFF" stroke-width="7"/>
    <line x1="185" y1="170" x2="185" y2="460" stroke="#C9A84C" stroke-width="11"/>
  </g>
  <circle cx="185" cy="315" r="145" fill="none" stroke="#FFFFFF" stroke-width="11"/>

  <!-- Gold vertical separator -->
  <line x1="365" y1="148" x2="365" y2="482" stroke="#C9A84C" stroke-width="2" opacity="0.7"/>

  <!-- Brand name -->
  <text x="398" y="288" font-family="'Barlow',Arial,sans-serif" font-weight="800" font-size="78" letter-spacing="-1">
    <tspan fill="#FFFFFF">MERIDIAN </tspan><tspan fill="#00AAEF">SYNERGY</tspan>
  </text>

  <!-- Tagline 1 -->
  <text x="400" y="352" font-family="'Barlow',Arial,sans-serif" font-weight="600" font-size="22" fill="#FFFFFF" opacity="0.75" letter-spacing="0.3">Conseil &amp; architecture d'entreprise · Drone · SaaS</text>

  <!-- Tagline 2 -->
  <text x="400" y="388" font-family="'Barlow',Arial,sans-serif" font-weight="400" font-size="20" fill="#00AAEF" opacity="0.85" letter-spacing="0.3">Du cadrage à la réalisation</text>

  <!-- Domain -->
  <text x="1180" y="614" font-family="'Barlow',Arial,sans-serif" font-weight="600" font-size="18" fill="#FFFFFF" opacity="0.35" text-anchor="end">meridian-synergy.com</text>

</svg>
